<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(~{::title})}">
    <title>Sửa thông tin Sách</title>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container">
        <h2>Cập nhật Sách</h2>

        <form th:action="@{/books/edit/{id}(id=${book.id})}" th:object="${book}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="title">Tên sách :</label>
                <input type="text" id="title" th:field="*{title}" />
                <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title Error</span>
            </div>

            <div class="form-group">
                <label for="author">Tác giả:</label>
                <input type="text" id="author" th:field="*{author}" />
                <span class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">Author Error</span>
            </div>

            <div class="form-group">
                <label for="quantity">Số lượng:</label>
                <input type="number" id="quantity" th:field="*{quantity}" />
                <span class="error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}">Quantity Error</span>
            </div>

            <div class="form-group">
                <label for="imageFile">Ảnh bìa (chọn ảnh mới để thay đổi):</label>
                <input type="file" id="imageFile" name="imageFile" accept="image/*" />
                <p th:if="*{coverImage}" style="margin-top: 5px;">Ảnh hiện tại: <img th:src="@{${book.coverImage}}" alt="Cover Image" style="max-width: 100px; max-height: 100px; display: block;"/></p>
            </div>

            <button type="submit" class="btn">Lưu thay đổi</button>
            <a th:href="@{/books}" class="btn-cancel">Hủy</a>
        </form>

        <div th:if="${successMessage}" class="success" style="margin-top: 15px;" th:text="${successMessage}"></div>

        <script th:if="${successMessage}">
            setTimeout(function() {
                window.location.href = '[[@{/books}]]';
            }, 1500);
        </script>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
