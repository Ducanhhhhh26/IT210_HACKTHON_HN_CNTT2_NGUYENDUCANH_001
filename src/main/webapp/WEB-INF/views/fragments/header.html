<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:replace="${title}">Quản lý Sách</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { padding: 20px; }
        .error { color: red; font-size: 0.9em; margin-bottom: 5px; display: block; }
        .success { color: green; margin-bottom: 10px; font-size: 1.1em; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"] { width: 300px; padding: 5px; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { padding: 5px 15px; text-decoration: none; color: white; background-color: #007bff; border: none; cursor: pointer; border-radius: 3px; display: inline-block; font-size: 14px; }
        .btn-danger { background-color: #dc3545; }
        .btn-warning { background-color: #ffc107; color: black; }
        .btn-add { margin-bottom: 15px; }
        .btn-cancel { text-decoration: none; display: inline-block; padding: 5px 15px; border-radius: 3px; background-color: #6c757d; color: white; }
        header { border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        header h1 { margin: 0 0 10px 0; font-size: 24px; }
        header nav a { text-decoration: none; color: #007bff; font-weight: bold; }
        footer { background-color: #f8f9fa; padding: 15px 20px; text-align: center; border-top: 1px solid #e9ecef; margin-top: 40px; }
        footer p { margin: 0; color: #6c757d; }
    </style>
</head>
<body>
<div th:fragment="header">
    <header style="text-align: center">
        <h1>Hệ thống Quản lý Thư viện</h1>
        <nav>
            <a th:href="@{/books}">Danh sách Sách</a>
        </nav>
    </header>
</div>
