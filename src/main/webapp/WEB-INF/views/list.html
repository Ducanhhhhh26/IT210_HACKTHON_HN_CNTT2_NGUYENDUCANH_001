<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(~{::title})}">
    <title>Quản lý Sách</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .success { color: green; margin-bottom: 10px; }
        .btn { padding: 5px 10px; text-decoration: none; color: white; background-color: #007bff; border-radius: 3px; }
        .btn-danger { background-color: #dc3545; }
        .btn-warning { background-color: #ffc107; color: black; }
        .btn-add { margin-bottom: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container">
        <h2>Danh sách Sách</h2>

        <div th:if="${successMessage}" class="success" th:text="${successMessage}"></div>

        <form th:action="@{/books}" method="get" style="margin-bottom: 15px;">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm theo tiêu đề hoặc tác giả..." style="width: 300px; padding: 5px;" />
            <button type="submit" class="btn">Tìm kiếm</button>
            <a th:href="@{/books}" class="btn" style="background-color: #6c757d;">Xóa bộ lọc</a>
        </form>

        <a th:href="@{/books/add}" class="btn btn-add">Thêm sách mới</a>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên sách (Title)</th>
                    <th>Tác giả (Author)</th>
                    <th>Số lượng (Quantity)</th>
                    <th>Ảnh bìa (Cover Image)</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}"></td>
                    <td th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.quantity}"></td>
                    <td>
                        <img th:if="${book.coverImage != null && !book.coverImage.isEmpty()}"
                             th:src="@{${book.coverImage}}"
                             alt="Cover"
                             style="width: 60px; height: 80px; object-fit: cover; border: 1px solid #ccc;"/>
                        <span th:unless="${book.coverImage != null && !book.coverImage.isEmpty()}">Không có ảnh</span>
                    </td>
                    <td>
                        <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-warning">Sửa</a>
                        <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-danger" onclick="return confirm('Bạn có chắc chắn muốn xóa sách này?');">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
